---
# Runs in a repository created from docs-spec-template (via "Use this
# template"). It automates the parts of UPGRADING.md that are safe to
# automate -- copying template-owned files wholesale -- and opens a PR so a
# maintainer can review, run the checks in UPGRADING.md section 3, and do the
# manual merge for shared files (section 2.5) and src/<spec>.adoc (2.6) that
# this workflow deliberately leaves untouched.
#
# This file is itself template-owned (see UPGRADING.md, "Which files are
# whose") and copies its own newer version like any other workflow below --
# changes land on the PR branch, so they take effect only once merged, never
# mid-run.
name: Template Sync

on:
  schedule:
    # Every Monday. Cadence, not urgency -- see UPGRADING.md section 6 for
    # when an upgrade is actually worth doing.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'riscv/docs-spec-template'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # See milestone-pr in version-bot.yml: create-pull-request adds its
          # own auth header, so a persisted token here yields a duplicate
          # Authorization header (400).
          persist-credentials: false

      - name: Check for bot token
        env:
          GHTOKEN: ${{ secrets.GHTOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GHTOKEN" ]]; then
            # Unlike milestone-pr in version-bot.yml, this is not just a
            # "checks stall" warning: GITHUB_TOKEN is hard-blocked by GitHub
            # from pushing any change under .github/workflows/, which this
            # workflow always touches. Without GHTOKEN (a PAT with the
            # `workflow` scope) the create-pull-request step below will fail
            # outright.
            echo "::warning::GHTOKEN is not set. This workflow updates files under .github/workflows/, and GITHUB_TOKEN cannot push those -- the pull request step below will fail. Set a GHTOKEN repository secret (a PAT with the 'workflow' scope). See README.adoc, 'Recommended repository secret'."
          fi

      - name: Add template remote
        run: |
          set -euo pipefail
          git remote add template https://github.com/riscv/docs-spec-template.git
          git fetch template main

      - name: Determine baseline and target
        id: refs
        run: |
          set -euo pipefail

          target="$(git rev-parse template/main)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "short_target=$(git rev-parse --short template/main)" >> "$GITHUB_OUTPUT"

          if [[ ! -f .template-version ]]; then
            echo "::warning::No .template-version file -- this repository has not adopted the UPGRADING.md baseline convention yet. Skipping automated sync; see UPGRADING.md section 1 to set one up, or run the procedure by hand once."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          baseline="$(awk -F': *' '/^template_sha:/ {print $2}' .template-version)"
          if [[ -z "$baseline" ]]; then
            echo "::warning::.template-version has no template_sha line. Skipping automated sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$baseline" 2>/dev/null; then
            echo "::warning::.template-version's template_sha ($baseline) is not reachable from the template remote. Skipping automated sync -- fix the baseline by hand per UPGRADING.md section 1.3."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$baseline" == "$target" ]]; then
            echo "Already at template/main ($target). Nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.refs.outputs.skip == 'false'
        run: git switch -c "gitbot/template-sync-${{ steps.refs.outputs.short_target }}"

      # Template-owned files: no per-repository content, safe to overwrite.
      # Kept in sync by hand with the list in UPGRADING.md, "Template-owned".
      - name: Copy template-owned files
        if: steps.refs.outputs.skip == 'false'
        run: |
          set -euo pipefail
          target="${{ steps.refs.outputs.target }}"

          git checkout "$target" -- \
            scripts/release-info.sh \
            scripts/stamp-antora-version.sh \
            scripts/update-spec-state.sh \
            scripts/build-pages-site.sh \
            scripts/gen-pages-playbook.js \
            tests/release-info-test.sh \
            .github/workflows/build-pdf.yml \
            .github/workflows/version-bot.yml \
            .github/workflows/publish-site.yml \
            .github/workflows/validate-content-source.yml \
            .github/workflows/pre-commit.yml \
            .github/workflows/vale-linting.yml \
            .github/workflows/template-sync.yml \
            .github/dependabot.yml \
            .pre-commit-config.yaml \
            docker-compose.yml \
            ANTORA.md \
            MIGRATION.md \
            ARC_SUBMISSION.md \
            UPGRADING.md \
            LICENSE \
            CODE_OF_CONDUCT.md \
            GOVERNANCE.md \
            docs-resources

          git submodule update --init --recursive

      - name: Report shared files that need a manual merge
        if: steps.refs.outputs.skip == 'false'
        id: shared
        run: |
          set -euo pipefail
          baseline="${{ steps.refs.outputs.baseline }}"
          target="${{ steps.refs.outputs.target }}"

          {
            echo 'checklist<<EOF'
            changed=false
            for f in Makefile antora.yml antora-playbook.yml package.json README.adoc .gitignore .gitmodules .vale.ini src/; do
              if ! git diff --quiet "$baseline" "$target" -- "$f" 2>/dev/null; then
                echo "- [ ] \`$f\` changed upstream -- merge by hand per UPGRADING.md section 2.5/2.6"
                changed=true
              fi
            done
            if [[ "$changed" == "false" ]]; then
              echo "- No shared files changed upstream in this range."
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update .template-version
        if: steps.refs.outputs.skip == 'false'
        run: |
          set -euo pipefail
          target="${{ steps.refs.outputs.target }}"
          cat > .template-version <<EOF
          # Records which docs-spec-template release this repository's tooling came from.
          # Nothing reads this file. Updated automatically by template-sync.yml.
          template_ref: template/main
          template_sha: $target
          upgraded_on: $(date +%Y-%m-%d)
          EOF
          git add .template-version

      - name: Create pull request
        if: steps.refs.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync template-owned files from docs-spec-template@${{ steps.refs.outputs.short_target }}'
          branch: gitbot/template-sync-${{ steps.refs.outputs.short_target }}
          delete-branch: true
          title: 'Template sync: pick up docs-spec-template changes (${{ steps.refs.outputs.short_target }})'
          body: |
            This PR was opened automatically by `template-sync.yml`. It copies
            **template-owned files only** (see UPGRADING.md, "Which files are
            whose") from `riscv/docs-spec-template@main`. Nothing in
            `modules/ROOT/`, `src/<your-spec>.adoc`, or the shared files listed
            below was touched.

            Compare: https://github.com/riscv/docs-spec-template/compare/${{ steps.refs.outputs.baseline }}...${{ steps.refs.outputs.target }}

            **Before merging:**
            ${{ steps.shared.outputs.checklist }}
            - [ ] Re-read the *Repository Setup Checklist* in README.adoc -- a new workflow may need new repository settings.
            - [ ] Run the checks in UPGRADING.md section 3 (tests, `make build`, `npm run preview`).
            - [ ] If `src/` changed upstream, compare it against your own assembler per UPGRADING.md section 2.6 before merging.
          labels: |
            template-sync
