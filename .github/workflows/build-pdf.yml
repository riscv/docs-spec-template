---
name: Create Specification Document

# The workflow is triggered by pull request, version tags, and manual dispatch.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Override version (e.g., v0.62). Milestone floors become official releases.
        required: false
        type: string
      target_phase:
        description: Pick a milestone floor (recommended for official releases).
        required: false
        type: choice
        default: auto-next
        options:
          - auto-next
          - draft-and-development
          - development-complete
          - stabilized
          - frozen
          - ratification-ready
          - ratified
      draft:
        description: Create release as a draft?
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    # Expose the resolved version/date so the stamp-site-version job can keep
    # antora.yml (the HTML site version) in exact lockstep with this PDF build.
    outputs:
      version: ${{ steps.set_build_version.outputs.version }}
      date: ${{ steps.set_build_version.outputs.date }}
      releasable: ${{ steps.classify.outputs.releasable }}

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # Pull the latest RISC-V Docs container image
      - name: Pull Container
        run: docker pull riscvintl/riscv-docs-base-container-image:latest

      # Set VERSION and DATE for this build.
      #
      # DEVELOPMENT builds (pull_request, push to main) resolve to
      # <latest-tag>-<sha> via release-info.sh -- byte-for-byte what a local
      # `make` produces. They must NOT compute `next`: a preview stamped with the
      # next release number spends a version that has not been cut, so the
      # eventual real release ships a second, different document under the same
      # name. (This is exactly how a PR preview and a later release both came out
      # as v0.02.) Nothing is released from these builds -- see RELEASABLE below.
      #
      # RELEASE builds are a tag push, or a manual dispatch with an explicit
      # version / milestone floor / auto-next.
      - name: Set build version
        id: set_build_version
        run: |
          set -euo pipefail

          # Auto-increment (`next`) refuses at a milestone gate with rc=10 (the
          # 0.01 band before the next manual milestone is exhausted). That is not
          # an error -- it means a maintainer must cut the milestone by hand -- so
          # rebuild the latest tag rather than failing the run.
          next_or_latest() {
            local base="$1" out
            if out="$(./scripts/release-info.sh next "$base" 2>/dev/null)"; then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$base"
            fi
          }

          # Empty unless a tag pins it; filled in below.
          date=""

          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            version="$(./scripts/release-info.sh normalize "${{ github.event.inputs.release_version }}")"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target_phase }}" != "auto-next" ]; then
            version="$(./scripts/release-info.sh phase-floor-version "${{ github.event.inputs.target_phase }}")"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="$(./scripts/release-info.sh normalize "${{ github.ref_name }}")"
            # Take the date from the TAGGED COMMIT, not from today. Rebuilding a
            # tag must reproduce an identical PDF filename and an identical
            # antora.yml stamp; with "today" every rebuild opened a stamp PR whose
            # entire diff was page-revdate, and misdated the released version.
            # Mirrors the same resolution in publish-site.yml.
            date="$(git log -1 --format=%cs "${{ github.ref_name }}")"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Auto-next: advance to the next interim version.
            #
            # This used to read "if latest is between milestone floors, rebuild
            # latest" -- an inverted test, because EVERY interim version is
            # between floors. It pinned auto-next to re-releasing the latest tag
            # forever, which is what produced the v0.01 -> v0.02 -> v0.01
            # sequence. Advance unconditionally; next_or_latest falls back only
            # at a milestone gate, which target_phase exists to cross.
            version="$(next_or_latest "$(./scripts/release-info.sh latest)")"
          else
            # Development build. release-info.sh yields <latest>-<sha>.
            version="$(./scripts/release-info.sh version)"
          fi

          # Resolve the date ONCE so the PDF and the Antora version stamp share it
          # exactly (no midnight-boundary drift between separate steps).
          date="${date:-$(date +%Y-%m-%d)}"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DATE=$date" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Classify release type
        id: classify
        run: |
          set -euo pipefail

          # A development version carries a -<sha> suffix (release-info.sh
          # get_version). It is not releasable, and every release/stamp step below
          # is gated on this rather than on the event name -- so no trigger, now or
          # added later, can cut a GitHub Release named after an untagged commit.
          if [ "${VERSION#*-}" != "${VERSION}" ]; then
            releasable=false
            echo "$VERSION is a development version; this run publishes nothing."
          else
            releasable=true
          fi
          echo "RELEASABLE=$releasable" >> "$GITHUB_ENV"
          echo "releasable=$releasable" >> "$GITHUB_OUTPUT"

          # Milestone-gate tags (v0.6, v0.8, v0.9, v0.99, v1.0) get a
          # non-prerelease GitHub Release. release-info.sh is the single source of
          # truth for which versions are milestones.
          if ./scripts/release-info.sh is-milestone "${VERSION}"; then
            echo "OFFICIAL_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "OFFICIAL_RELEASE=false" >> "$GITHUB_ENV"
          fi

      # Build Files. VERSION and DATE are exported so the Makefile and
      # release-info.sh produce ARC-compliant PDF names: <short>-v<ver>-<YYYYMMDD>.pdf
      - name: Build Files
        run: |
          set -euo pipefail
          export VERSION="${VERSION}"
          export DATE="${DATE}"
          echo "Building ${VERSION} (${DATE})"
          make

      # Upload the built documents as a single artifact.
      #
      # The HTML is rendered on every run whether or not we keep it -- build-docs
      # depends on $(DOCS_HTML) as well as $(DOCS_PDF) -- so retaining it costs no
      # extra build time, and reviewers get the rendered document instead of only
      # the PDF. It travels as one file: the spec sets :data-uri:, so images and
      # the stylesheet are inlined and nothing sidecar has to ship with it.
      #
      # `*` does not cross directory separators, so this cannot sweep up an Antora
      # build/site/ or build/pages-site/ tree if one ever lands in this job.
      #
      # Release assets stay PDF-only on purpose (see the steps below): the ARC
      # submission artifact is the PDF, and the published HTML is the Antora site.
      - name: Upload Build Artifacts
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: Build Artifacts
          path: |
            ${{ github.workspace }}/build/*.pdf
            ${{ github.workspace }}/build/*.html
          retention-days: 30

      # Put a direct link in the run summary, so reaching the build output is one
      # click from the Checks tab rather than a hunt down the summary page. Same
      # reasoning as validate-content-source.yml: needs no permissions and works
      # on fork PRs, unlike a PR comment.
      - name: Link the build artifacts in the run summary
        if: steps.upload.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "### Built document"
            echo
            echo "[Download the build artifacts]($ARTIFACT_URL) — \`${VERSION}\` (${DATE})."
            echo
            echo "- Downloading requires being signed in to GitHub (an Actions limitation)."
            echo "- Retained for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"

      # Create official release for version tag pushes
      - name: Create Release (Tag Push, Official)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push' && github.ref_type == 'tag' && env.OFFICIAL_RELEASE == 'true' && env.RELEASABLE == 'true'

      # Create prerelease for non-milestone version tag pushes
      - name: Create Release (Tag Push, Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push' && github.ref_type == 'tag' && env.OFFICIAL_RELEASE != 'true' && env.RELEASABLE == 'true'

      # Create manual release for milestone versions
      - name: Create Release (Manual, Official)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: github.event_name == 'workflow_dispatch' && env.OFFICIAL_RELEASE == 'true' && env.RELEASABLE == 'true'

      # Create manual prerelease for non-milestone versions
      - name: Create Release (Manual, Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: github.event_name == 'workflow_dispatch' && env.OFFICIAL_RELEASE != 'true' && env.RELEASABLE == 'true'

  # Keep the Antora HTML site version in EXACT lockstep with the PDF this run just
  # built: stamp the SAME resolved version/date into antora.yml on main, so the
  # central playbook publishes the version the PDF carries. The PDF and this stamp
  # come from one build job (same source, same VERSION/DATE) -- they cannot drift.
  #
  # Runs only for real releases: not PR previews (nothing to publish) and not
  # drafts (not public yet). Never moves main's version backwards, so rebuilding
  # an older tag will not regress the site.
  #
  # The stamp lands as a REVIEW PR, not a direct push to `main`. This template is
  # seeded into many spec repos whose branch protection we do not control, and a
  # rejected push would leave the release green while the site version silently
  # lagged the PDF -- the exact divergence this job exists to prevent. Opening a
  # PR works under any protection setting and matches the milestone-PR idiom in
  # version-bot.yml. Cost: a maintainer must merge it for the site to catch up,
  # so treat that merge as part of cutting a release (see MIGRATION.md Step 14).
  stamp-site-version:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      needs.build.outputs.releasable == 'true' &&
      github.event.inputs.draft != 'true' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
          # Do not persist the token as a git extraheader. create-pull-request
          # injects its own auth header; a persisted one here makes git send two
          # Authorization headers -> GitHub 400 "Duplicate header: Authorization".
          persist-credentials: false

      - name: Stamp antora.yml to match the released PDF version
        id: stamp
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DATE: ${{ needs.build.outputs.date }}
        run: |
          set -euo pipefail

          current="$(grep -E '^version:' antora.yml | awk '{print $2}')"
          echo "main antora.yml version: ${current:-<none>}; released version: $VERSION"

          # Monotonic guard: never stamp main backwards (e.g. when an old tag is
          # rebuilt). Compare by DECIMAL order via release-info.sh -- `sort -V`
          # would rank v0.8 below v0.61 and stamp the site backwards.
          #
          # Skip at >=, not just at >. At an EQUAL version the only field that can
          # still differ is page-revdate, and a PR that moves a released version's
          # date forward is pure churn that also misdates the release. (Rebuilding
          # v0.01 a day later opened exactly such a PR; the tag-derived DATE in the
          # build job closes the other half of that hole.)
          if [ -n "$current" ] && [ "$current" != "~" ]; then
            if [ "$(./scripts/release-info.sh compare "$current" "$VERSION")" != "-1" ]; then
              echo "main is already at $current (>= $VERSION); skipping stamp."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Leaves antora.yml modified in the worktree; create-pull-request below
          # is what commits it. stamp-antora fails loudly if it cannot stamp, so a
          # no-op here means "already correct", never "silently did nothing".
          make stamp-antora VERSION="$VERSION" DATE="$DATE"

          if git diff --quiet -- antora.yml; then
            echo "antora.yml already matches $VERSION; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open site version stamp PR
        if: steps.stamp.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
          base: main
          commit-message: 'chore(site): stamp Antora version ${{ needs.build.outputs.version }} to match PDF'
          branch: gitbot/stamp-site-${{ needs.build.outputs.version }}
          delete-branch: true
          title: Stamp Antora site version ${{ needs.build.outputs.version }} to match released PDF
          body: |
            This PR was opened automatically by the `${{ needs.build.outputs.version }}` release build.

            The ARC Author Guide requires the published HTML site version to match
            the submission PDF exactly. Antora reads a static `version:` from the
            committed `antora.yml`, so a release has to stamp that file.

            Released PDF version: `${{ needs.build.outputs.version }}` (${{ needs.build.outputs.date }})

            **Until this merges, the site version lags the released PDF.** The
            values come from `scripts/release-info.sh` -- the same source the PDF
            build uses -- so this needs a merge, not an edit.
          labels: |
            site-version
            automated
          add-paths: |
            antora.yml
